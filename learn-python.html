<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小派学 Python · 从高一信息课到 AI 时代</title>
<meta name="description" content="基于上海高一信息课编程水平设计：5 章 · 约 40 分钟，从 print、变量、if 出发，一路写到会聊天的规则版小 AI。">
<meta property="og:title" content="小派学 Python · 从高一信息课到 AI 时代">
<meta property="og:description" content="🎓 基于上海高一信息课编程水平设计：5 章 · 约 40 分钟，从 print、变量、if 出发，一路写到会聊天的规则版小 AI。配练习、自动复习、真实 Python 运行环境。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0616">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-glow"></div>
<canvas id="particles"></canvas>

<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="dot">🐍</div>
      <div>小派学 Python<small>PYTHON × AI · 高一起点</small></div>
    </div>
    <nav class="nav"></nav>
    <div class="side-foot">
      <button class="btn sm ghost" id="resetBtn">🗑 重置学习进度</button>
      <div class="mini">完全离线可用 · 进度仅存本机<br>建议使用 Chrome / Edge 打开</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="crumb" id="crumb">首页</span>
      <span class="spacer"></span>
      <span class="streak-pill" id="streakPill">🔥 0 天</span>
      <span class="xp-pill" id="xpPill">⭐ Lv.1</span>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<canvas id="confetti"></canvas>
<div id="toast"></div>

<!-- Python 练习场抽屉 -->
<div class="playground" id="playground">
  <div class="pg-head">
    <span class="ttl">🐍 Python 练习场</span>
    <span class="eng mini" id="pgEngine">引擎：内置迷你版（离线）</span>
    <span class="spacer"></span>
    <select id="pgExamples" aria-label="示例代码"></select>
    <button class="btn sm" id="pgClose">收起</button>
  </div>
  <div class="pg-body">
    <div class="pg-editor">
      <textarea id="pgCode" spellcheck="false" autocomplete="off" autocorrect="off"></textarea>
    </div>
    <div class="pg-out" id="pgOut"><span class="hint">点任意代码块的「▶ 运行」试试；也可以选示例或直接改代码。</span></div>
  </div>
  <div class="pg-actions">
    <button class="btn sm primary" id="pgRun">▶ 运行</button>
    <button class="btn sm" id="pgClear">清空</button>
    <span class="mini-hint">暂不支持 input() 输入 · 完整 Python 引擎自动加载（需联网一次）</span>
  </div>
</div>

<script src="mini-py.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
